services:
  # ===================================================================
  # 1. Spring Boot Backend REST API (Docker Container Web Service)
  # ===================================================================
  - type: web
    name: student-analyzer-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HIBERNATE_DDL_AUTO
        value: update

  # ===================================================================
  # 2. React + Vite Frontend (Static Site with SPA Rewrites)
  # ===================================================================
  - type: web
    name: student-analyzer-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://student-performance-analyzer-1-1yde.onrender.com/api
